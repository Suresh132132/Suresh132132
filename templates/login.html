
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Service Center</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .bg-image {
      background-image: url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1470&q=80');
      background-size: cover;
      background-position: center;
      height: 100vh;
      filter: brightness(0.7);
      position: fixed;
      width: 100%;
      z-index: -1;
    }
    .login-container {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .login-form {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 24px rgb(0 0 0 / 0.15);
      max-width: 400px;
      width: 100%;
    }
    .login-form h2 {
      margin-bottom: 25px;
      color: #343a40;
      text-align: center;
      font-weight: 700;
    }
    .btn-login {
      background: linear-gradient(45deg, #007bff, #6610f2);
      border: none;
    }
    .btn-login:hover {
      background: linear-gradient(45deg, #6610f2, #007bff);
    }
    .form-control:focus {
      box-shadow: 0 0 5px #6610f2;
      border-color: #6610f2;
    }
    .text-register {
      text-align: center;
      margin-top: 15px;
      font-weight: 500;
    }
    .text-register a {
      color: #6610f2;
      text-decoration: none;
      font-weight: 700;
    }
    .text-register a:hover {
      text-decoration: underline;
    }
    /* Flash messages styling */
    .flash-message {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="bg-image"></div>

  <div class="login-container">
    <form action="{{ url_for('login') }}" method="POST" class="login-form">
      <h2>Login</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'error' else category }} flash-message" role="alert">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input
          type="email"
          class="form-control"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button type="submit" class="btn btn-login w-100 py-2 text-white fw-bold">Log In</button>

      <div class="text-register mt-3">
        New user? <a href="{{ url_for('register') }}">Register here</a>
      </div>
    </form>
  </div>
</body>
</html>
