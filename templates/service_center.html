<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nearby Service Centers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: url('https://images.unsplash.com/photo-1615731921029-0636d427e9e9?auto=format&fit=crop&w=1470&q=80') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 40px 20px;
    }

    .title {
      text-align: center;
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 30px;
      color: #ffcc00;
      text-shadow: 1px 1px 10px #000;
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 20px;
      width: 300px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card h2 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      color: #ffdd57;
    }

    .card p {
      margin: 8px 0;
      color: #ddd;
    }

    .card a {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 18px;
      background-color: #ff9900;
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      transition: background 0.3s ease;
    }

    .card a:hover {
      background-color: #e68a00;
    }

    @media (max-width: 768px) {
      .title {
        font-size: 2rem;
      }
      .card {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="content">
    <h1 class="title">Nearby Service Centers</h1>

    <div class="card-container">
      {% for center in centers %}
        <div class="card">
          <h2>{{ center.name }}</h2>
          <p><strong>Location:</strong> {{ center.location }}</p>
          <p><strong>Contact:</strong> {{ center.contact }}</p>
          <a href="{{ url_for('service_center_detail', center_id=center.id) }}">View Details</a>
        </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
